# mavlink-router: Pixracer (USB) <-> QGroundControl (TCP / UDP) and rover_teleop (UDP)
#
# Joystick path: QGC --MANUAL_CONTROL--> router --> rover_teleop --> /cmd_vel (ROS 2).
# MANUAL_CONTROL is NOT forwarded to the FCU, so PX4 never executes the joystick itself.

[General]
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = auto

# Pixracer over USB; udev symlink, see README. Baud is ignored by USB CDC.
[UartEndpoint fcu]
Device = /dev/rover_fcu
Baud = 115200
# 69 = MANUAL_CONTROL
BlockMsgIdOut = 69

# QGC connects to <rover-ip>:14550 (UDP) or <rover-ip>:5760 (TCP)
[UdpEndpoint qgc]
Mode = Server
Address = 0.0.0.0
Port = 14550

# rover_teleop listens on 127.0.0.1:14560 (udpin). Only what it needs:
# 0 = HEARTBEAT, 69 = MANUAL_CONTROL
[UdpEndpoint teleop]
Mode = Normal
Address = 127.0.0.1
Port = 14560
AllowMsgIdOut = 0,69
