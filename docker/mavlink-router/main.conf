# mavlink-router: Pixracer (USB) <-> QGroundControl (TCP / UDP)

[General]
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = auto

# Pixracer over USB; udev symlink, see README. Baud is ignored by USB CDC.
[UartEndpoint fcu]
Device = /dev/rover_fcu
Baud = 115200

# QGC connects to <rover-ip>:14550 (UDP) or <rover-ip>:5760 (TCP)
[UdpEndpoint qgc]
Mode = Server
Address = 0.0.0.0
Port = 14550
