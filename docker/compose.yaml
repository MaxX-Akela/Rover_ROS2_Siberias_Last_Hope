name: rover

# Build context is the repository root:
#   docker compose -f docker/compose.yaml --profile robot up --build
#   docker compose -f docker/compose.yaml --profile sim up --build

x-ros: &ros
  image: ${ROS_IMAGE:-rover-ros:${TAG:-latest}}
  build:
    context: ..
    dockerfile: docker/ros/Dockerfile
    target: rover-ros
  network_mode: host
  ipc: host
  privileged: true
  restart: unless-stopped
  stop_signal: SIGINT
  stop_grace_period: 30s
  volumes:
    - /dev:/dev
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}

x-px4-build: &px4-build
  context: ..
  dockerfile: docker/px4/Dockerfile
  args:
    PX4_REPO: ${PX4_REPO:-https://github.com/MaxX-Akela/PX4-Autopilot.git}
    PX4_VERSION: ${PX4_VERSION:-main}

services:

  # real robot
  ros:
    <<: *ros
    profiles: [ robot ]
    volumes:
      - /dev:/dev
      # libcamera enumerates cameras through udev
      - /run/udev:/run/udev:ro
      # edit cameras.yaml / network.yaml without rebuilding the image
      - ../rover_bringup/config:/opt/rover/share/rover_bringup/config:ro
      # LED strip hardware and event table (led:=true)
      - ../rover_led/config:/opt/rover/share/rover_led/config:ro
    depends_on: [ uxrce-agent ]
    # args: cameras, stream, web_video, teleop, fcu_bridge (all true by default),
    # slam, led (false by default; /dev/spidev* for led comes from the /dev mount).
    # The uXRCE-DDS agent runs in its own service below.
    command: ros2 launch rover_bringup bringup.launch.py agent:=false

  # Pixracer TELEM2 <-> ROS 2 (uXRCE-DDS). Same image as `ros`.
  uxrce-agent:
    <<: *ros
    profiles: [ robot ]
    environment:
      <<: *ros-env
      XRCE_DEV: ${XRCE_DEV:-/dev/rover_fcu_telem}
      XRCE_BAUD: ${XRCE_BAUD:-921600}
    command: [ "bash", "-c", "exec MicroXRCEAgent serial --dev \"$${XRCE_DEV}\" -b \"$${XRCE_BAUD}\"" ]

  # Pixracer (USB) -> QGroundControl. Third-party, not ROS.
  mavlink-router:
    image: ${MAVLINK_ROUTER_IMAGE:-rover-mavlink-router:${TAG:-latest}}
    build:
      context: ./mavlink-router
    profiles: [ robot ]
    network_mode: host
    restart: unless-stopped
    volumes:
      - /dev:/dev
      - ./mavlink-router/main.conf:/etc/mavlink-router/main.conf:ro
    # ttyACM (166) and ttyUSB (188) serial devices
    device_cgroup_rules:
      - 'c 166:* rmw'
      - 'c 188:* rmw'

  # simulation: gz <- px4-sitl <-(UDP 8888)-> MicroXRCEAgent in rover-ros
  gz:
    image: ${GZ_IMAGE:-rover-gz:${TAG:-latest}}
    build:
      <<: *px4-build
      target: gz
    profiles: [ sim ]
    network_mode: host
    ipc: host
    restart: unless-stopped

  px4-sitl:
    image: ${PX4_IMAGE:-rover-px4-sitl:${TAG:-latest}}
    build:
      <<: *px4-build
      target: px4-sitl
    profiles: [ sim ]
    network_mode: host
    ipc: host
    depends_on: [ gz ]
    restart: unless-stopped

  ros-sim:
    <<: *ros
    privileged: false
    volumes: []
    profiles: [ sim ]
    depends_on: [ px4-sitl ]
    # MicroXRCEAgent udp4 -p 8888 + rover_fcu_bridge (PX4 runs in its own container)
    command: ros2 launch rover_sim sim.launch.py px4:=false agent_port:=8888
