name: docker

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PX4_REPO: https://github.com/Pulse-Width-Modulation-Technologies/PX4-Autopilot-Rover.git
  PX4_VERSION: rover

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: rover-ros,            arch: amd64, runner: ubuntu-24.04,     platform: linux/amd64, context: ., file: docker/ros/Dockerfile,                 target: rover-ros }
          - { image: rover-ros,            arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, context: ., file: docker/ros/Dockerfile,                 target: rover-ros }
          - { image: rover-mavlink-router, arch: amd64, runner: ubuntu-24.04,     platform: linux/amd64, context: docker/mavlink-router, file: docker/mavlink-router/Dockerfile, target: '' }
          - { image: rover-mavlink-router, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, context: docker/mavlink-router, file: docker/mavlink-router/Dockerfile, target: '' }
          - { image: rover-px4-sitl,       arch: amd64, runner: ubuntu-24.04,     platform: linux/amd64, context: ., file: docker/px4/Dockerfile,                 target: px4-sitl, px4: true }
    steps:
      - uses: actions/checkout@v4

      - name: Registry name (lower case owner)
        id: reg
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            ${{ matrix.px4 && format('PX4_REPO={0}', env.PX4_REPO) || '' }}
            ${{ matrix.px4 && format('PX4_VERSION={0}', env.PX4_VERSION) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.reg.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [ rover-ros, rover-mavlink-router, rover-px4-sitl ]
    steps:
      - name: Registry name (lower case owner)
        id: reg
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.reg.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          REGISTRY_IMAGE: ${{ steps.reg.outputs.name }}
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.reg.outputs.name }}:${{ steps.meta.outputs.version }}"
