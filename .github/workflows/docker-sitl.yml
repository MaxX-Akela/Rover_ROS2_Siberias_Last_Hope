name: docker-sitl

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-sitl-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PX4_REPO: https://github.com/Pulse-Width-Modulation-Technologies/PX4-Autopilot-Rover.git
  PX4_VERSION: rover
  IMAGE: rover-px4-sitl

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build rover-px4-sitl (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Registry name (lower case owner)
        id: reg
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.reg.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/px4/Dockerfile
          target: px4-sitl
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PX4_REPO=${{ env.PX4_REPO }}
            PX4_VERSION=${{ env.PX4_VERSION }}
          cache-from: type=gha,scope=rover-px4-sitl-amd64
          cache-to: type=gha,mode=max,scope=rover-px4-sitl-amd64
